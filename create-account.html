<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Vietcombank | Create Additional Account</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="styles.css" />
	<script src="auth-watchdog.js"></script>
	<script>
		if (sessionStorage.getItem("vcbAuthenticated") !== "true") {
			location.replace("index.html");
		}
	</script>
</head>
<body class="home-page">
	<div class="home-shell home-main-shell">
		<header class="home-topbar">
			<div class="home-brand">
				<div class="home-logo-frame">
					<img src="assets/logo-vietcombank.png" alt="Vietcombank logo" />
				</div>
				<div class="home-brand-copy">
					<strong>Vietcombank</strong>
					<span>Create additional account</span>
				</div>
			</div>
			<nav class="home-nav" aria-label="Secondary navigation">
				<a href="home.html">Back to home</a>
				<button class="home-nav-button" id="logoutBtn" type="button">Logout</button>
			</nav>
		</header>

		<section class="db-card" style="margin-top: 12px;">
			<h3>Create additional account</h3>
			<form id="createAccountForm" class="action-form" autocomplete="off">
				<label class="action-field" for="newAccountUsername">
					<span>New username</span>
					<input id="newAccountUsername" name="newAccountUsername" type="text" placeholder="new_username" required />
				</label>
				<label class="action-field" for="newAccountPassword">
					<span>New password (>= 8 characters)</span>
					<input id="newAccountPassword" name="newAccountPassword" type="password" minlength="8" placeholder="Password123" required />
				</label>
				<button class="action-button" type="submit">Create account</button>
				<p class="action-status" id="accountActionStatus" aria-live="polite"></p>
			</form>
		</section>
	</div>

	<script>
		const apiBase = window.location.origin.startsWith("http")
			? `${window.location.origin}/api`
			: "http://localhost:8080/api";

		const cccd = sessionStorage.getItem("vcbCCCD") || "";
		const logoutBtn = document.getElementById("logoutBtn");
		const createAccountForm = document.getElementById("createAccountForm");
		const newAccountUsername = document.getElementById("newAccountUsername");
		const newAccountPassword = document.getElementById("newAccountPassword");
		const accountActionStatus = document.getElementById("accountActionStatus");

		const clearCustomerSession = () => {
			window.VCBSessionWatchdog.clearCustomerSession();
		};

		const invalidateCustomerSession = () => {
			clearCustomerSession();
			window.location.replace("index.html");
		};

		window.VCBSessionWatchdog.start({
			intervalMs: 15000,
			onInvalid: invalidateCustomerSession,
			validator: async () => {
				if (!cccd) {
					return false;
				}

				const healthResponse = await window.VCBSessionWatchdog.fetchWithTimeout(`${apiBase}/health`, {
					cache: "no-store"
				});
				if (!healthResponse.ok) {
					return false;
				}

				const accountResponse = await window.VCBSessionWatchdog.fetchWithTimeout(
					`${apiBase}/accounts?cccd=${encodeURIComponent(cccd)}`,
					{ cache: "no-store" }
				);
				if (!accountResponse.ok) {
					return false;
				}

				const accounts = await accountResponse.json();
				return Array.isArray(accounts) && accounts.length > 0;
			}
		});

		const setActionStatus = (message, isOk = false) => {
			accountActionStatus.textContent = message;
			accountActionStatus.classList.toggle("ok", isOk);
		};

		logoutBtn.addEventListener("click", () => {
			clearCustomerSession();
			window.location.replace("index.html");
		});

		createAccountForm.addEventListener("submit", async (event) => {
			event.preventDefault();

			const username = newAccountUsername.value.trim();
			const password = newAccountPassword.value.trim();

			if (!cccd) {
				setActionStatus("No CCCD found in session. Please login again.");
				return;
			}

			if (!username || !password) {
				setActionStatus("Username and password are required.");
				return;
			}

			if (password.length < 8) {
				setActionStatus("Password must be at least 8 characters.");
				return;
			}

			try {
				const response = await fetch(`${apiBase}/accounts/create`, {
					method: "POST",
					headers: {
						"Content-Type": "application/json"
					},
					body: JSON.stringify({
						cccd,
						username,
						password
					})
				});

				const payload = await response.json();
				if (!response.ok) {
					setActionStatus(payload.message || "Failed to create account.");
					return;
				}

				setActionStatus(`${payload.message} Account: ${payload.accountNumber}.`, true);
				createAccountForm.reset();
			} catch (error) {
				setActionStatus("Cannot connect to API. Start backend server and try again.");
			}
		});
	</script>
</body>
</html>
